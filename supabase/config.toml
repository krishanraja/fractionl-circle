project_id = "ksyuwacuigshvcyptlhe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
# Local dev defaults. Production site_url and the custom auth domain
# (auth.circle.fractionl.ai) are managed in the Supabase dashboard - see
# docs/supabase-custom-domain.md. Production redirect targets are listed below
# so OAuth round-trips resolve in every environment.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "https://localhost:3000",
  "https://circle.fractionl.ai",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[functions.test-google-secret]
verify_jwt = false

[functions.generate-user-insights]
verify_jwt = false

[functions.transcribe]
verify_jwt = false

[functions.parse-voice-log]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.generate-signals]
verify_jwt = true

[functions.emit-lifecycle]
verify_jwt = true

# Public by design: anonymous visitors have no JWT, so the top-of-funnel
# 'landed' event can only be recorded by an unauthenticated endpoint. It accepts
# anonymous events only and holds no user identity.
[functions.track-event]
verify_jwt = false

# On-demand warm-digest preview (user JWT).
[functions.warm-digest]
verify_jwt = true

# Proactive Socratic sharpen question (user JWT).
[functions.next-question]
verify_jwt = true

# Voiced plan strengtheners: research a concern / fold in an idea (user JWT).
[functions.strengthen-plan]
verify_jwt = true

# Nightly warmth recompute (service-role, x-cron-secret).
[functions.compute-warmth]
verify_jwt = false

# Weekly warm-reach digest delivery (service-role, x-cron-secret).
[functions.cron-warm-digest]
verify_jwt = false

# Weekly quiet-contact re-engagement sweep (service-role, x-cron-secret).
[functions.cron-reengage]
verify_jwt = false

# Nightly semantic-search embedding backfill (service-role, x-cron-secret).
[functions.cron-embed-circle]
verify_jwt = false
