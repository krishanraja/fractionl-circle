<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Circle</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">Circle</div>
        <div class="subtitle">LinkedIn Capture</div>
      </header>

      <section id="connected" hidden>
        <div class="row">
          <div class="status ok">Connected</div>
          <button id="sign-out" class="ghost" title="Sign out">Sign out</button>
        </div>
        <div id="identity" class="identity"></div>

        <div class="section-label">
          <span>Recent captures</span>
          <button id="clear-recent" class="link" hidden>Clear</button>
        </div>
        <ul id="recent" class="recent"></ul>
        <div id="recent-empty" class="help" hidden>
          Open any LinkedIn profile to capture it. The list updates automatically.
        </div>
      </section>

      <section id="disconnected">
        <div class="status off">Not connected</div>
        <p class="help">
          In the Circle web app, open <strong>Add a source → Connect browser
          extension</strong>, copy the pairing token, and paste it below.
        </p>
        <textarea id="pairing-input" placeholder="Paste pairing token"></textarea>
        <button id="pair" class="primary">Connect</button>
        <div id="pair-error" class="error" hidden></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
